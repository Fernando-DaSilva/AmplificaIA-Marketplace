services:
  amplifica-marketplace:
    build: .
    container_name: amplifica-marketplace-prototype
    restart: always
    ports:
      - "8050:8050"
    environment:
      - PORT=8050
      - ENVIRONMENT=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.amplifica-marketplace.rule=Host(`marketplace.srv1767287.hstgr.cloud`) || Host(`srv1767287.hstgr.cloud`) || Host(`marketplace.amplifica.ai`)"
      - "traefik.http.routers.amplifica-marketplace.entrypoints=web"
      - "traefik.http.services.amplifica-marketplace.loadbalancer.server.port=8050"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3
