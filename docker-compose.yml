services:
  amplifica-marketplace:
    build: .
    container_name: amplifica-marketplace-prototype
    restart: always
    ports:
      - "8050:8050"
    environment:
      - PORT=8050
      - ENVIRONMENT=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.amplificaia-marketplace.rule=Host(`marketplace.srv1767287.hstgr.cloud`) || Host(`amplificaia-marketplace.srv1767287.hstgr.cloud`) || Host(`srv1767287.hstgr.cloud`)"
      - "traefik.http.routers.amplificaia-marketplace.entrypoints=websecure"
      - "traefik.http.routers.amplificaia-marketplace.tls.certresolver=letsencrypt"
      - "traefik.http.services.amplificaia-marketplace.loadbalancer.server.port=8050"

